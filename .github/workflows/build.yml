name: build

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - name: Track upstream HEAD
        id: track
        run: |
          latest=$(git ls-remote https://github.com/yuja/hhkb-studio-tools HEAD | cut -f1)
          if [ "$latest" = "$(cat UPSTREAM_COMMIT)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$latest" > UPSTREAM_COMMIT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bump upstream to ${latest:0:7}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        if: steps.track.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          cargo install --locked cargo-deb
          ./build.sh
          echo "VERSION=$(cat dist/VERSION)" >> "$GITHUB_ENV"

      - name: Release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release $tag already exists"
          else
            gh release create "$tag" dist/*.deb --target "$(git rev-parse HEAD)" \
              --title "hhkb-studio-tools $VERSION" \
              --notes "Built from yuja/hhkb-studio-tools@$(cat UPSTREAM_COMMIT)"
          fi

      # shortcut: only the latest .deb is served, so APT cannot roll back; publish all release assets if that is ever needed.
      - name: Build APT repo
        if: env.VERSION != ''
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils
          mkdir repo && cp dist/*.deb repo/
          cd repo
          apt-ftparchive packages . > Packages
          gzip -k Packages
          apt-ftparchive release . > Release
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes -abs -o Release.gpg Release
          gpg --export > hhkb-studio-tools.gpg

      - uses: actions/upload-pages-artifact@v5
        if: env.VERSION != ''
        with:
          path: repo

      - uses: actions/deploy-pages@v5
        if: env.VERSION != ''
